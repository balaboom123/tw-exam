[project]
name = "tw-exam"
version = "0.1.0"
description = "Mirror, normalize, and publish Taiwan examination papers from official sources."
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["repo_data: tests that load checked-in provider or site catalogs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
