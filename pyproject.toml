[project]
name = "tw-exam"
version = "0.1.0"
description = "Mirror, normalize, and publish Taiwan examination papers from official sources."
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["repo_data: tests that load checked-in provider or site catalogs"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
