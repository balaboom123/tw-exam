name: audit-recent

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 1 * *"

permissions:
  contents: write

concurrency:
  group: site-publication-default
  queue: max
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # The monthly two-year audit can rebuild a cold MOEX mirror.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore mirror directory
        id: mirror_cache
        uses: actions/cache/restore@v6
        with:
          path: mirror
          key: moex-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            moex-mirror-

      - name: Recover evicted MOEX mirror from public storage
        if: ${{ steps.mirror_cache.outputs.cache-matched-key == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/mirror_snapshots.py restore --provider moex --repository "${{ github.repository }}" --allow-missing

      - name: Inspect release coverage
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_assets.py coverage

      - name: Fail unsupported hosted bootstrap
        if: steps.release_state.outputs.bootstrap_required == 'true'
        run: |
          echo "Hosted bootstrap is unsupported on GitHub-hosted runners."
          echo "Repair the release from a machine with persistent MOEX state, then rerun this workflow."
          exit 1

      - name: Run recent audit
        id: recent_audit
        # _download_affected_bundles shells out to `gh release download` to
        # fetch each affected bundle's previous ZIP, so this python step needs
        # the token as much as the explicit `gh` steps below do. Without it gh
        # exits with "could not find any host configurations" on the first
        # bundle, which is what failed the runs on 2026-07-20, 07-27 and 08-01.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m app sync-incremental --provider moex --years 2 --write-manifest --manifest data/providers/moex/source-manifest.json --download-affected-bundles --publish-plan-output .tmp/site-publish-plan.json --bundle-dir bundles/sites/default

      - name: Save mirror directory
        if: ${{ !cancelled() && steps.recent_audit.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: mirror
          key: moex-mirror-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save durable public MOEX mirror snapshot
        if: ${{ !cancelled() && steps.recent_audit.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/mirror_snapshots.py save --provider moex --repository "${{ github.repository }}" --generation "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Publish default site
        run: python -m app publish-site --site-id default --repository "${{ github.repository }}" --publish-plan .tmp/site-publish-plan.json

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_assets.py ensure

      - name: Upload downloadable bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_assets.py upload

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_assets.py prune

      - name: Commit audited data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: audit recent downloadable bundles" data/providers/moex data/sites/default
