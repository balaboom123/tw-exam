name: sync-rcpet-cap

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: rcpet-cap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore mirror directory
        uses: actions/cache/restore@v6
        with:
          path: mirror
          key: rcpet-cap-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rcpet-cap-mirror-

      - name: Run RCPET CAP sync
        run: python -m app sync-full --provider rcpet_cap --site-id default

      - name: Save mirror directory
        if: '!cancelled()'
        uses: actions/cache/save@v6
        with:
          path: mirror
          key: rcpet-cap-mirror-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit regenerated RCPET CAP provider data
        # sync-full writes the papers it did fetch and records the ones it could
        # not, then exits non-zero. Gating this step on success discarded the
        # whole refresh whenever one upstream file was unavailable, and kept the
        # failure record out of the repository where it could be acted on.
        if: '!cancelled()'
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh RCPET CAP provider data" data/providers/rcpet_cap
