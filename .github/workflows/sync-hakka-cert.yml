name: sync-hakka-cert

on:
  workflow_dispatch:
  schedule:
    - cron: "55 5 * * 3"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Historical Hakka assets can require a cold-cache rebuild after source coverage changes.
    timeout-minutes: 360
    concurrency:
      group: sync-hakka-cert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore mirror directory
        uses: actions/cache/restore@v6
        with:
          path: mirror
          key: hakka-cert-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hakka-cert-mirror-

      - name: Run Hakka cert sync
        run: python -m app sync-full --provider hakka_cert --site-id default --prune-orphaned-mirror

      - name: Save mirror directory
        if: '!cancelled()'
        uses: actions/cache/save@v6
        with:
          path: mirror
          key: hakka-cert-mirror-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit regenerated Hakka cert provider data
        # sync-full writes the papers it did fetch and records the ones it could
        # not, then exits non-zero. Gating this step on success discarded the
        # whole refresh whenever one upstream file was unavailable, and kept the
        # failure record out of the repository where it could be acted on.
        if: '!cancelled()'
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh Hakka cert provider data" data/providers/hakka_cert
