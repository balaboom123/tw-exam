name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - app/**
      - catalog/**
      - data/providers/**
      - data/sites/default/**
      - schemas/**
      - scripts/validate_publication.py
      - scripts/validate_source_inventory.py
      - .github/workflows/deploy-pages.yml
  # The data-writing jobs push to main with GITHUB_TOKEN, and GitHub starts no
  # workflow run for such a push, so the push trigger above has never once
  # fired for a scheduled sync. Reacting to the sync run itself is what keeps
  # the published site in step with the catalog on main.
  workflow_run:
    types: [completed]
    workflows:
      - audit-recent
      - sync-admissions
      - sync-certifications
      - sync-education
      - sync-employment
      - sync-full
      - sync-incremental
      - sync-taisugar-recruit
      - sync-teacher-recruit-central-alliance
  # Backstop: rebuilds main when the triggers above miss a data-writing run.
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate shell scripts and whitespace
        run: |
          bash -n .github/scripts/*.sh
          git diff --check
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_ENABLE_ADSENSE: "false"
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
