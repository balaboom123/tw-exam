name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - app/**
      - catalog/**
      - data/providers/**
      - data/sites/default/**
      - schemas/**
      - scripts/validate_publication.py
      - scripts/validate_source_inventory.py
      - .github/workflows/deploy-pages.yml
  # The data-writing jobs push to main with GITHUB_TOKEN, and GitHub starts no
  # workflow run for such a push, so the push trigger above has never once
  # fired for a scheduled sync. Reacting to the sync run itself is what keeps
  # the published site in step with the catalog on main.
  workflow_run:
    types: [completed]
    workflows:
      - audit-recent
      - sync-ceec-ast
      - sync-ceec-gsat
      - sync-cpc-recruit
      - sync-full
      - sync-gept-cert
      - sync-hakka-cert
      - sync-hce-cmu
      - sync-hce-nsysu
      - sync-hce-nthu
      - sync-hce-tcu
      - sync-incremental
      - sync-ipas-cert
      - sync-jlpt-cert
      - sync-moea-recruit
      - sync-post-recruit
      - sync-rcpet-cap
      - sync-sfi-cert
      - sync-special-admission
      - sync-tabf-cert
      - sync-taigi-cert
      - sync-taipower-recruit
      - sync-taisugar-recruit
      - sync-tcte-tve
      - sync-teacher-qual
      - sync-teacher-recruit-central-alliance
      - sync-teacher-recruit-kaohsiung
      - sync-teacher-recruit-newtaipei
      - sync-teacher-recruit-tainan
      - sync-teacher-recruit-taipei-elementary
      - sync-teacher-recruit-taipei-junior
      - sync-teacher-recruit-taoyuan-elementary
      - sync-tii-cert
      - sync-tocfl-cert
      - sync-tqc-cert
      - sync-twc-recruit
      - sync-wdasec-skill
  # Backstop: rebuilds main when the triggers above miss a data-writing run.
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate shell scripts and whitespace
        run: |
          bash -n .github/scripts/*.sh
          git diff --check
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_ENABLE_ADSENSE: "false"
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
