name: sync-certifications

on:
  workflow_dispatch:
    inputs:
      provider_id:
        description: "Sync one certification provider or all providers"
        type: choice
        default: all
        options:
          - all
          - gept_cert
          - ipas_cert
          - jlpt_cert
          - sfi_cert
          - tabf_cert
          - taigi_cert
          - tii_cert
          - tocfl_cert
          - tqc_cert
          - wdasec_skill
  schedule:
    - cron: "20 5 * * 3"

permissions:
  contents: write

jobs:
  sync:
    name: ${{ matrix.provider_id }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - provider_id: gept_cert
            durable_snapshot: true
            cache_prefix: gept-cert
            timeout_minutes: 30
            publish: false
            prune_orphaned_mirror: false
          - provider_id: ipas_cert
            durable_snapshot: true
            cache_prefix: ipas-cert
            timeout_minutes: 30
            publish: false
            prune_orphaned_mirror: false
          - provider_id: jlpt_cert
            durable_snapshot: false
            cache_prefix: jlpt-cert
            timeout_minutes: 30
            publish: false
            prune_orphaned_mirror: false
          - provider_id: sfi_cert
            durable_snapshot: true
            cache_prefix: sfi-cert
            timeout_minutes: 30
            publish: false
            prune_orphaned_mirror: false
          - provider_id: tabf_cert
            durable_snapshot: true
            cache_prefix: tabf-cert
            timeout_minutes: 30
            publish: false
            prune_orphaned_mirror: false
          - provider_id: taigi_cert
            durable_snapshot: true
            cache_prefix: taigi-cert
            timeout_minutes: 30
            publish: false
            prune_orphaned_mirror: false
          - provider_id: tii_cert
            durable_snapshot: false
            cache_prefix: tii-cert
            timeout_minutes: 30
            publish: false
            prune_orphaned_mirror: false
          - provider_id: tocfl_cert
            durable_snapshot: true
            cache_prefix: tocfl-cert
            timeout_minutes: 30
            publish: false
            prune_orphaned_mirror: false
          - provider_id: tqc_cert
            durable_snapshot: true
            cache_prefix: tqc-cert
            timeout_minutes: 30
            publish: false
            prune_orphaned_mirror: false
          - provider_id: wdasec_skill
            durable_snapshot: true
            cache_prefix: wdasec-skill
            timeout_minutes: 120
            publish: true
            prune_orphaned_mirror: false
    uses: ./.github/workflows/_sync-provider.yml
    with:
      provider_id: ${{ matrix.provider_id }}
      enabled: ${{ !inputs.provider_id || inputs.provider_id == 'all' || matrix.provider_id == inputs.provider_id }}
      cache_prefix: ${{ matrix.cache_prefix }}
      timeout_minutes: ${{ matrix.timeout_minutes }}
      publish: ${{ matrix.publish }}
      durable_snapshot: ${{ matrix.durable_snapshot }}
      prune_orphaned_mirror: ${{ matrix.prune_orphaned_mirror }}
