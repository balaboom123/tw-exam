name: sync-teacher-recruit-tainan

on:
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-teacher-recruit-tainan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore mirror directory
        uses: actions/cache/restore@v6
        with:
          path: mirror
          key: teacher-recruit-tainan-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            teacher-recruit-tainan-mirror-

      - name: Run Tainan teacher recruitment sync
        run: python -m app sync-full --provider teacher_recruit_tainan --site-id default

      - name: Save mirror directory
        if: '!cancelled()'
        uses: actions/cache/save@v6
        with:
          path: mirror
          key: teacher-recruit-tainan-mirror-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit regenerated Tainan teacher recruitment provider data
        # sync-full writes the papers it did fetch and records the ones it could
        # not, then exits non-zero. Gating this step on success discarded the
        # whole refresh whenever one upstream file was unavailable, and kept the
        # failure record out of the repository where it could be acted on.
        if: '!cancelled()'
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh Tainan teacher recruitment provider data" data/providers/teacher_recruit_tainan
