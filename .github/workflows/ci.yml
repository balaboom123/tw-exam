name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-python:
    name: Fast Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run fast Python tests
        run: uv run --frozen python -m pytest -q -m "not repo_data"

  python:
    name: Python and catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run catalog-data tests
        run: uv run --frozen python -m pytest -q -m repo_data

      - name: Audit public catalog
        run: uv run --frozen python -m app audit-catalog --repo-root . --site-id default --strict --output .tmp/catalog-audit.json

      - name: Validate publication and JSON syntax
        run: uv run --frozen python scripts/validate_publication.py

      - name: Validate persisted JSON Schemas
        run: uv run --frozen python scripts/validate_schemas.py

      - name: Validate source scope inventory
        run: uv run --frozen python scripts/validate_source_inventory.py

      - name: Verify generated provider indexes against source files
        run: uv run --frozen python scripts/build_provider_indexes.py --check

      - name: Validate documentation projections
        run: |
          uv run --frozen python scripts/render_docs.py --check
          uv run --frozen python scripts/validate_docs.py --check

      - name: Audit event-level coverage
        # CI checks out without the gitignored mirror tree, so the download
        # dimension is unverifiable here and is audited by operators instead.
        # Every other dimension - identity, publication, coverage exceptions,
        # and quarantine - is enforced.
        run: uv run --frozen python -m app history-audit --repo-root . --site-id default --strict --skip-mirror-check --output .tmp/history-audit.json

      - name: Plan release shards
        run: uv run --frozen python -m app plan-release --repo-root . --site-id default --output .tmp/release-plan.json

      - name: Validate shell scripts and whitespace
        run: |
          bash -n .github/scripts/*.sh
          git diff --check

  frontend:
    name: Frontend test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_ENABLE_ADSENSE: "false"

      - name: Check JavaScript size budget
        run: node build/check-bundle-size.mjs
        working-directory: frontend
