name: sync-teacher-recruit-central-alliance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-teacher-recruit-central-alliance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore mirror directory
        uses: actions/cache/restore@v6
        with:
          path: mirror
          key: teacher-recruit-central-alliance-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            teacher-recruit-central-alliance-mirror-

      - name: Run Central Alliance teacher recruitment sync
        run: python -m app sync-full --provider teacher_recruit_central_alliance --site-id default

      - name: Save mirror directory
        if: '!cancelled()'
        uses: actions/cache/save@v6
        with:
          path: mirror
          key: teacher-recruit-central-alliance-mirror-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit regenerated Central Alliance teacher recruitment provider data
        # Run the shared guard even after a sync failure so it can diagnose the
        # partial output. The guard refuses non-deployable state, while the
        # Actions run retains the failure evidence instead of main.
        if: '!cancelled()'
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh Central Alliance teacher recruitment provider data" data/providers/teacher_recruit_central_alliance
