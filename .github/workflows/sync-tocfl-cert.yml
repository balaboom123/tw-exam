name: sync-tocfl-cert

on:
  # Manual: TOCFL's mirror stays out of public storage and exceeds the Actions
  # cache, so a runner starts cold. Refresh from the maintainer's local mirror.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/_sync-provider.yml
    with:
      provider_id: tocfl_cert
      cache_prefix: tocfl-cert
      timeout_minutes: 360
      publish: false
      prune_orphaned_mirror: false
      durable_snapshot: false
