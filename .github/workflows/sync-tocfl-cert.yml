name: sync-tocfl-cert

on:
  workflow_dispatch:
  schedule:
    - cron: "55 5 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-tocfl-cert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore mirror directory
        uses: actions/cache/restore@v6
        with:
          path: mirror
          key: tocfl-cert-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tocfl-cert-mirror-

      - name: Run TOCFL cert sync
        run: python -m app sync-full --provider tocfl_cert --site-id default

      - name: Save mirror directory
        if: '!cancelled()'
        uses: actions/cache/save@v6
        with:
          path: mirror
          key: tocfl-cert-mirror-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit regenerated TOCFL cert provider data
        # sync-full writes the papers it did fetch and records the ones it could
        # not, then exits non-zero. Gating this step on success discarded the
        # whole refresh whenever one upstream file was unavailable, and kept the
        # failure record out of the repository where it could be acted on.
        if: '!cancelled()'
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh TOCFL cert provider data" data/providers/tocfl_cert
