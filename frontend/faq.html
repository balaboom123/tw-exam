        "mainEntity": [
          {
            "@type": "Question",
            "name": "如何下載試題？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "在首頁搜尋考試類科（例如護理師、律師），或用分類與年度篩選，找到後點選右側紅色下載鈕，即可取得該類科的多年度 ZIP 檔。"
            }
          },
          {
            "@type": "Question",
            "name": "為什麼下載前要先加入 LINE 社群？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "本站免費維運，LINE 社群是我們維持更新動力、也讓考生互相交流的方式。第一次下載時會先開啟社群邀請連結，之後同一瀏覽器即自動解鎖，可直接下載所有檔案。"
            }
          },
          {
            "@type": "Question",
            "name": "年度是民國還是西元？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "以民國（ROC）年度為主，並在括號附上西元年份對照，例如民國 104–114（2015–2025）。"
            }
          },
          {
            "@type": "Question",
            "name": "下載的檔案是什麼格式？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "每個類科為一個 ZIP 壓縮檔，內含歷年試題 PDF；是否附答案依各命題機關公開的內容而定。"
            }
          },
          {
            "@type": "Question",
            "name": "找不到我的類科，或缺少某個年度？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "可能是官方尚未公開，或本站尚未收錄。歡迎透過 GitHub Issue 或電子郵件回報，我們會盡快補上。"
            }
          },
          {
            "@type": "Question",
            "name": "本站是官方網站嗎？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "不是。本站為非官方彙整，與考選部及各命題機關無任何隸屬關係；試題著作權屬原命題機關所有。"
            }
          }
        ]
