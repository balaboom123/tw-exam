# Netlify is used for deploy previews only. GitHub Pages is the canonical production host.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BASE_PATH = "/"
  VITE_ENABLE_ADSENSE = "false"

[context.deploy-preview]
  [context.deploy-preview.environment]
    VITE_BASE_PATH = "/"
    VITE_ENABLE_ADSENSE = "false"
